# Disposable catalog records are seeded in PostgreSQL; no worker runs here.
[credential_stores.fixture]
type = "s3"
bucket = "fixture-credentials"
region = "us-east-1"
[services.development]
name = "Development tools"
description = "Session integration service"
delivery = "direct"
endpoint = "https://development.example"
credentials.token = { env = "DEVELOPMENT_TOKEN" }
environment.DEVELOPMENT_URL = { from = "endpoint" }

[services.notifications]
name = "Notifications"
description = "Run integration service"
delivery = "direct"
endpoint = "https://notifications.example"
credentials.token = { env = "NOTIFICATIONS_TOKEN" }
environment.NOTIFICATIONS_URL = { from = "endpoint" }
