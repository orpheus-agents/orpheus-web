services:
  core:
    environment:
      ORPHEUS_BROWSER_AUTH: saml
      ORPHEUS_PUBLIC_URL: https://localhost:18443
      SAML_SP_ENTITY_ID: orpheus-web-test
      SAML_IDP_METADATA_FILE: /auth/idp.xml
      SAML_SP_CERT_FILE: /auth/cert.pem
      SAML_SP_KEY_FILE: /auth/key.pem
    volumes: [../../.integration-auth:/auth:ro]
  ui:
    ports: ['127.0.0.1:18443:8443']
    volumes:
      - ../../.integration-auth:/auth:ro
      - ./tls.conf:/etc/nginx/extra/tls.conf:ro
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: https://localhost:18444
      KC_HTTPS_CERTIFICATE_FILE: /auth/cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /auth/key.pem
    ports: ['127.0.0.1:18444:8443']
    volumes:
      - ../../.integration-auth:/auth:ro
      - ../../.integration-auth/realm.json:/opt/keycloak/data/import/realm.json:ro
    tmpfs: [/opt/keycloak/data]
