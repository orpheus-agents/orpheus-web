name: orpheus-web-dev
x-core: &core
  image: orpheus-web-core:${ORPHEUS_CORE_COMMIT:?Use npm run stack:start}
  build:
    context: ${ORPHEUS_CORE_CONTEXT:?Use npm run stack:start}
    dockerfile: .docker/app/prod/Dockerfile
services:
  db:
    image: postgres:16.10
    environment:
      POSTGRES_DB: orpheus
      POSTGRES_USER: orpheus
      POSTGRES_PASSWORD: fixture-password
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U orpheus]
      interval: 2s
      timeout: 2s
      retries: 30
  migrate:
    <<: *core
    command: [migrate, up]
    environment:
      DATABASE_URL: postgres://orpheus:fixture-password@db:5432/orpheus
    depends_on:
      db: {condition: service_healthy}
  seed:
    image: postgres:16.10
    command: [psql, --set, ON_ERROR_STOP=1, --file, /fixtures/templates.sql]
    environment:
      PGHOST: db
      PGDATABASE: orpheus
      PGUSER: orpheus
      PGPASSWORD: fixture-password
    volumes: [./templates.sql:/fixtures/templates.sql:ro]
    depends_on:
      migrate: {condition: service_completed_successfully}
  agentbox:
    image: node:26.7.0-alpine
    user: node
    command: [node, /fixtures/agentbox.mjs]
    volumes: [./agentbox.mjs:/fixtures/agentbox.mjs:ro]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8090/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15
  core:
    <<: *core
    environment:
      DATABASE_URL: postgres://orpheus:fixture-password@db:5432/orpheus
      PUBLIC_API_KEYS: '["integration-only-key"]'
      ENV_ENCRYPTION_KEY: Zm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHktMzJieXQ=
      ORPHEUS_CONFIG_FILE: /etc/orpheus/config.toml
      ORPHEUS_BROWSER_AUTH: anonymous
      ORPHEUS_PUBLIC_URL: ${ORPHEUS_PUBLIC_URL:?Use npm run stack:start}
      AGENTBOX_API_URL: http://agentbox:8090
      AGENTBOX_API_KEY: fixture-agentbox-key
    volumes: [./core.toml:/etc/orpheus/config.toml:ro]
    healthcheck:
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30
    depends_on:
      seed: {condition: service_completed_successfully}
      agentbox: {condition: service_healthy}
  ui:
    build:
      context: ../..
      dockerfile: .docker/app/prod/Dockerfile
    environment:
      ORPHEUS_UPSTREAM: http://core:8000
    ports: ['127.0.0.1:${ORPHEUS_WEB_HTTP_PORT:-18085}:8080']
    healthcheck:
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      core: {condition: service_healthy}
